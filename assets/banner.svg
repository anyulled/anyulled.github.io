<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Architecture Guardrails Skills</title>
  <desc id="desc">A bold repository banner with layered gradients, grid lines, and a technical architecture motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#102A43"/>
      <stop offset="1" stop-color="#0B1F33"/>
    </linearGradient>
    <linearGradient id="accent" x1="210" y1="108" x2="1360" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DF9FF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#5EEAD4" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 120) rotate(122) scale(320 240)">
      <stop offset="0" stop-color="#7DF9FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7DF9FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#D6E4FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>
  <circle cx="1180" cy="124" r="260" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="92" y="82" width="1416" height="316" rx="32" fill="url(#panel)" stroke="#94A3B8" stroke-opacity="0.18"/>
    <rect x="92" y="82" width="1416" height="10" rx="5" fill="url(#accent)"/>
  </g>

  <g opacity="0.9">
    <path d="M250 320C324 280 374 250 426 212C510 151 570 141 640 165C702 186 744 250 800 262C867 276 918 226 980 188C1063 138 1133 128 1220 165C1282 191 1331 245 1410 258" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M250 320C324 280 374 250 426 212C510 151 570 141 640 165C702 186 744 250 800 262C867 276 918 226 980 188C1063 138 1133 128 1220 165C1282 191 1331 245 1410 258" stroke="#7DF9FF" stroke-opacity="0.18" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#E2E8F0">
    <text x="140" y="176" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="0.22em" fill="#7DF9FF">ARCHITECTURE GUARDRAILS</text>
    <text x="140" y="250" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" letter-spacing="-0.04em">Skills for software boundaries,</text>
    <text x="140" y="312" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" letter-spacing="-0.04em">coupling, and governance.</text>
    <text x="140" y="360" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="500" fill="#CBD5E1">Agent-agnostic architecture validation for repos, docs, events, data, and deployment topologies.</text>
  </g>

  <g transform="translate(1130 120)">
    <rect x="0" y="0" width="320" height="216" rx="24" fill="#050B14" stroke="#7DF9FF" stroke-opacity="0.22"/>
    <g stroke="#7DF9FF" stroke-opacity="0.38" stroke-width="2">
      <line x1="32" y1="40" x2="288" y2="40"/>
      <line x1="32" y1="84" x2="288" y2="84"/>
      <line x1="32" y1="128" x2="288" y2="128"/>
      <line x1="32" y1="172" x2="288" y2="172"/>
    </g>
    <g fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600">
      <text x="32" y="26">PASS / WARNING / FAIL</text>
      <text x="32" y="70">ADR tracing</text>
      <text x="32" y="114">EDA integrity</text>
      <text x="32" y="158">Complexity</text>
      <text x="32" y="202">Deployability</text>
    </g>
    <g fill="url(#accent)">
      <circle cx="257" cy="70" r="6"/>
      <circle cx="257" cy="114" r="6"/>
      <circle cx="257" cy="158" r="6"/>
      <circle cx="257" cy="202" r="6"/>
    </g>
  </g>
</svg>
